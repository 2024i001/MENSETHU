<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【課題研究】</title>
    <link rel="icon" href="AIKN.png" type="image/png">
    <!-- スタイリング用 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 非表示クラス */
        .tab-content.hidden { display: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- =================================================== -->
    <!-- 1. アプリケーション最上部：タイトルエリア -->
    <!-- =================================================== -->
    <header class="bg-slate-900 text-white py-4 px-6 shadow-md">
        <h1 class="text-xl sm:text-2xl font-bold tracking-wide">
            課題研究
        </h1>
    </header>

    <!-- メイン領域 -->
    <main class="max-w-7xl w-full mx-auto p-4 sm:p-6 flex-1 flex flex-col">

        <!-- =================================================== -->
        <!-- 2. タイトル直下：タブ切り替えボタン -->
        <!-- =================================================== -->
        <div class="flex border-b border-slate-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
            <button id="btn-app1" onclick="switchTab('app1')" 
                    class="tab-btn flex-1 py-3 px-4 font-bold text-center text-indigo-600 border-b-2 border-indigo-600 bg-white transition-colors">
                アプリ 1
            </button>
            <button id="btn-app2" onclick="switchTab('app2')" 
                    class="tab-btn flex-1 py-3 px-4 font-bold text-center text-slate-500 hover:text-slate-700 bg-slate-50 transition-colors">
                アプリ 2
            </button>
        </div>

        <!-- =================================================== -->
        <!-- 3. 各アプリの表示エリア（コピペ領域） -->
        <!-- =================================================== -->

        <!-- ▼▼▼ [アプリ 1] 表示エリア ▼▼▼ -->
        <div id="panel-app1" class="tab-content bg-white p-6 rounded-b-lg border border-slate-200 shadow-sm flex-1">
            
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課題研究</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
    /* 【追加】隠しリンクボタンのスタイル */
    .secret-trigger {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 12px;
      height: 12px;
      background-color: #edf2f7; /* 背景に近い非常に薄いグレー */
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s, background-color 0.2s;
      z-index: 9999;
    }
    /* ホバーした時だけ少しだけ自己主張する */
    .secret-trigger:hover {
      opacity: 0.8;
      background-color: #cbd5e0;
    }
  </style>
</head>
<body>
        <!-- ▲▲▲ [アプリ 1] 表示エリア終了 ▲▲▲ -->


        <!-- ▼▼▼ [アプリ 2] 表示エリア ▼▼▼ -->
        <div id="panel-app2" class="tab-content hidden bg-white p-6 rounded-b-lg border border-slate-200 shadow-sm flex-1">

            <!-- ▼▼▼ [アプリ2] コピペ位置 (ここから) ▼▼▼ -->
            
            <div class="p-8 text-center border-2 border-dashed border-slate-300 rounded-lg">
                <p class="text-slate-500 font-medium">ここに【アプリ 2】のコード（HTML/CSS/JavaScript）を貼り付けてください。</p>
            </div>

            <!-- ▲▲▲ [アプリ2] コピペ位置 (ここまで) ▲▲▲ -->

        </div>
        <!-- ▲▲▲ [アプリ 2] 表示エリア終了 ▲▲▲ -->

    </main>

    <!-- =================================================== -->
    <!-- 4. タブ切り替え用 最小限JavaScript -->
    <!-- =================================================== -->
    <script>
        function switchTab(targetApp) {
            const btnApp1 = document.getElementById('btn-app1');
            const btnApp2 = document.getElementById('btn-app2');
            const panelApp1 = document.getElementById('panel-app1');
            const panelApp2 = document.getElementById('panel-app2');

            if (targetApp === 'app1') {
                // アプリ1を表示
                panelApp1.classList.remove('hidden');
                panelApp2.classList.add('hidden');

                // ボタンのスタイル切り替え
                btnApp1.className = "tab-btn flex-1 py-3 px-4 font-bold text-center text-indigo-600 border-b-2 border-indigo-600 bg-white transition-colors";
                btnApp2.className = "tab-btn flex-1 py-3 px-4 font-bold text-center text-slate-500 hover:text-slate-700 bg-slate-50 transition-colors";
            } else if (targetApp === 'app2') {
                // アプリ2を表示
                panelApp1.classList.add('hidden');
                panelApp2.classList.remove('hidden');

                // ボタンのスタイル切り替え
                btnApp2.className = "tab-btn flex-1 py-3 px-4 font-bold text-center text-indigo-600 border-b-2 border-indigo-600 bg-white transition-colors";
                btnApp1.className = "tab-btn flex-1 py-3 px-4 font-bold text-center text-slate-500 hover:text-slate-700 bg-slate-50 transition-colors";
            }
        }
    </script>
</body>
</html>
