<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面接スケジュール管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-10">

  <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
    <header class="text-center py-4 border-b border-slate-200">
      <h1 class="text-2xl font-bold text-slate-900">面接スケジュール登録</h1>
    </header>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">1. 氏名・生徒ID（手入力またはQR）</label>
        <div class="flex gap-2">
          <input type="text" id="candidateName" list="studentListOptions" placeholder="名前またはIDを入力" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <datalist id="studentListOptions"></datalist>
          <button id="scanQrBtn" type="button" onclick="toggleScanner()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition-colors">
            カメラ(QR)
          </button>
        </div>
        <p class="text-xs text-slate-500 mt-1">※名前は出来る限りQRコードによる入力を推奨しています。</p>
        <div id="reader" class="mt-3 hidden rounded-lg overflow-hidden border border-slate-300"></div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">2. 面接本番日時</label>
        <input type="datetime-local" id="interviewDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="pt-2">
        <button type="button" id="submitBtn" onclick="addEvent()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-sm transition-colors">
          カレンダー＆スプレッドシートに登録
        </button>
      </div>
    </div>

    <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
      <div id="calendar"></div>
    </div>
  </div>

  <script>
    // ★ここにデプロイしたGASのWebアプリURL（/execで終わるURL）を貼り付けてください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzD94nqiKLyyIUaI2Qkkxh8-50N12sddRF3iugEFedu8-Cw-ZBuuH7kxRYd10M4-jGLDw/exec";

    let calendar;
    let html5QrCode = null;
    let isScanning = false;
    let masterStudentList = []; // スプレッドシートから取得した生徒マスター

    document.addEventListener('DOMContentLoaded', async function() {
      // 初期日時の設定（1時間後）
      const now = new Date();
      now.setHours(now.getHours() + 1, 0, 0, 0);
      document.getElementById('interviewDate').value = formatDateForInput(now);

      // FullCalendar 初期化
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ja',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: { today: '今日', month: '月', week: '週', day: '日' },
        events: []
      });
      calendar.render();

      // GASから生徒マスターリストを取得
      await fetchStudentMaster();
    });

    // GASから生徒マスター（A列）をロード
    async function fetchStudentMaster() {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("ここに")) return;

      try {
        const res = await fetch(GAS_WEB_APP_URL);
        if (res.ok) {
          const list = await res.json();
          if (Array.isArray(list)) {
            masterStudentList = list;
            const datalist = document.getElementById('studentListOptions');
            datalist.innerHTML = '';
            list.forEach(item => {
              const option = document.createElement('option');
              option.value = item;
              datalist.appendChild(option);
            });
          }
        }
      } catch (err) {
        console.warn("マスターデータ取得エラー:", err);
      }
    }

    function formatDateForInput(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    // QRスキャナー制御
    async function toggleScanner() {
      if (!isScanning) {
        document.getElementById('reader').classList.remove('hidden');
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

        try {
          isScanning = true;
          document.getElementById('scanQrBtn').innerText = "カメラを閉じる";
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
              const resolved = resolveStudentId(decodedText);
              document.getElementById('candidateName').value = resolved;
              stopScanner();
            },
            () => {}
          );
        } catch (err) {
          alert("カメラ起動エラー: " + err);
          await stopScanner();
        }
      } else {
        await stopScanner();
      }
    }

    async function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }
      document.getElementById('reader').classList.add('hidden');
      document.getElementById('scanQrBtn').innerText = "カメラ(QR)";
      isScanning = false;
    }

    // 名前入力をマスターの「名前+ID」の形に判定・変換する補正ロジック
    function resolveStudentId(inputText) {
      const query = inputText.trim();
      if (!query) return '';

      // 1. 完全一致
      const exactMatch = masterStudentList.find(item => item === query);
      if (exactMatch) return exactMatch;

      const clean = (str) => str.replace(/\s+/g, '').toLowerCase();
      const cleanedQuery = clean(query);

      // 2. 空白を無視して一致
      const spaceIgnoreMatch = masterStudentList.find(item => clean(item) === cleanedQuery);
      if (spaceIgnoreMatch) return spaceIgnoreMatch;

      // 3. 名前から始まる場合（例: "後藤 優宗" → "後藤 優宗24i12"）
      const startsWithMatch = masterStudentList.find(item => clean(item).startsWith(cleanedQuery));
      if (startsWithMatch) return startsWithMatch;

      // 4. 名前の一部が含まれる場合
      const includesMatch = masterStudentList.find(item => clean(item).includes(cleanedQuery));
      if (includesMatch) return includesMatch;

      // マスターになければそのまま返す
      return query;
    }

    // 登録処理（POST送信）
    async function addEvent() {
      const rawName = document.getElementById('candidateName').value.trim();
      const dateVal = document.getElementById('interviewDate').value;

      if (!rawName || !dateVal) {
        alert('名前と日時を入力してください。');
        return;
      }

      const studentId = resolveStudentId(rawName);
      const start = new Date(dateVal.replace('T', ' '));
      const end = new Date(start.getTime() + 60 * 60000);

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "登録中...";

      try {
        // CORSプレフライト回避のため text/plain でJSON文字列を送信
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain'
          },
          body: JSON.stringify({
            studentId: studentId,
            dateVal: dateVal
          })
        });

        const result = await response.json();

        if (result.status === 'success') {
          // カレンダー反映
          calendar.addEvent({
            title: result.studentId,
            start: start,
            end: end,
            allDay: false
          });

          alert(`「${result.studentId}」さんの面接予約を登録しました！`);
          document.getElementById('candidateName').value = '';
        } else {
          alert('登録失敗: ' + (result.message || 'エラーが発生しました。'));
        }
      } catch (error) {
        alert('送信エラーが発生しました。WebアプリURLやネットワークを確認してください。\n' + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "カレンダー＆スプレッドシートに登録";
      }
    }
  </script>
</body>
</html>
