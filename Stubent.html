<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面接スケジュール管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-10">

  <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
    <header class="text-center py-4 border-b border-slate-200">
      <h1 class="text-2xl font-bold text-slate-900">面接スケジュール登録</h1>
    </header>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">1. 氏名・生徒ID（手入力またはQR）</label>
        <div class="flex gap-2">
          <input type="text" id="candidateName" placeholder="名前またはIDを入力" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg">
          <button id="scanQrBtn" type="button" onclick="toggleScanner()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg">
            カメラ(QR)
          </button>
        </div>
        <div id="reader" class="mt-3 hidden rounded-lg overflow-hidden border border-slate-300"></div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">2. 面接本番日時</label>
        <input type="datetime-local" id="interviewDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
      </div>

      <div class="pt-2">
        <button type="button" onclick="addEvent()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-sm">
          カレンダー＆スプレッドシートに登録
        </button>
      </div>
    </div>

    <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
      <div id="calendar"></div>
    </div>
  </div>

  <script>
    // ★ここにデプロイしたGASのWebアプリURLを貼り付けてください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzurw7xhUhpu1z1yjs87FqznNcgGzHDsvhoYSe7KsYVh9lkcnvZMIVBfoyvS-2foT0X/exec";

    let calendar;
    let html5QrCode = null;
    let isScanning = false;

    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      now.setHours(now.getHours() + 1, 0, 0, 0);
      document.getElementById('interviewDate').value = formatDateForInput(now);

      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ja',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: { today: '今日', month: '月', week: '週', day: '日' },
        events: []
      });
      calendar.render();
    });

    function formatDateForInput(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    async function toggleScanner() {
      if (!isScanning) {
        document.getElementById('reader').classList.remove('hidden');
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

        try {
          isScanning = true;
          document.getElementById('scanQrBtn').innerText = "カメラを閉じる";
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
              document.getElementById('candidateName').value = decodedText;
              stopScanner();
            },
            () => {}
          );
        } catch (err) {
          alert("カメラ起動エラー: " + err);
          await stopScanner();
        }
      } else {
        await stopScanner();
      }
    }

    async function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }
      document.getElementById('reader').classList.add('hidden');
      document.getElementById('scanQrBtn').innerText = "カメラ(QR)";
      isScanning = false;
    }

    async function addEvent() {
      const name = document.getElementById('candidateName').value.trim();
      const dateVal = document.getElementById('interviewDate').value;

      if (!name || !dateVal) {
        alert('名前と日時を入力してください。');
        return;
      }

      const start = new Date(dateVal.replace('T', ' '));
      const end = new Date(start.getTime() + 60 * 60000);

      // カレンダーに即時反映
      calendar.addEvent({
        title: name,
        start: start,
        end: end,
        allDay: false
      });

      // GASのAPIへ送信
      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            studentId: name,
            dateVal: dateVal
          })
        });

        alert('カレンダーとスプレッドシートに登録しました！');
        document.getElementById('candidateName').value = '';
      } catch (error) {
        alert('送信エラーが発生しました: ' + error.message);
      }
    }
  </script>
</body>
</html>
