<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面接スケジュール管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- HTML5-QRCode -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    /* Streamlined scan area styles */
    #reader video {
      border-radius: 0.5rem;
      object-fit: cover;
    }
    /* Toast animation */
    .toast-enter {
      transform: translateY(-20px);
      opacity: 0;
    }
    .toast-show {
      transform: translateY(0);
      opacity: 1;
      transition: all 0.3s ease-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-calendar-check text-xl"></i>
        </div>
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-sm font-semibold text-slate-700">1. 氏名・生徒ID（手入力またはQR）</label>
          <span id="filterStatus" class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-medium">全件表示中</span>
        </div>
        <div class="flex gap-2">
          <input type="text" id="candidateName" placeholder="名前またはIDを入力（入力値でカレンダー絞り込み）" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
          <button id="scanQrBtn" type="button" onclick="toggleScanner()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg shrink-0">
            カメラ(QR)
          </button>
        </div>
        <p class="text-xs text-slate-400 mt-1">※ IDや名前を入力すると、該当する面接日のみが下のカレンダーに表示されます。</p>
        <div id="reader" class="mt-3 hidden rounded-lg overflow-hidden border border-slate-300"></div>
      </div>

      <div>
    <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
      <div id="calendar"></div>
    </div>
  </div>

  <!-- カスタムトースト通知コンテナ -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <script>
    // ★ここにデプロイしたGASのWebアプリURLを貼り付けてください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzurw7xhUhpu1z1yjs87FqznNcgGzHDsvhoYSe7KsYVh9lkcnvZMIVBfoyvS-2foT0X/exec";

    let calendar;
    let html5QrCode = null;
    let isScanning = false;
    // 登録されたすべてのイベントを保持する配列
    let allEvents = [];

    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      now.setHours(now.getHours() + 1, 0, 0, 0);
      document.getElementById('interviewDate').value = formatDateForInput(now);

      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ja',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: { today: '今日', month: '月', week: '週', day: '日' },
        events: []
      });
      calendar.render();

      // 氏名・IDの入力欄変更時にカレンダーをリアルタイムでフィルタリング
      const nameInput = document.getElementById('candidateName');
      nameInput.addEventListener('input', filterCalendarEvents);
    });

    // 入力されたID・氏名に基づいてカレンダーの表示イベントを更新する関数
    function filterCalendarEvents() {
      const keyword = document.getElementById('candidateName').value.trim().toLowerCase();
      const filterStatus = document.getElementById('filterStatus');

      // 全イベントを一括消去してから条件に合うものだけ再追加
      calendar.removeAllEvents();

      if (!keyword) {
        // 未入力時は全件表示
        allEvents.forEach(evt => calendar.addEvent(evt));
        filterStatus.innerText = "全件表示中";
        filterStatus.className = "text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-medium";
      } else {
        // ID / 氏名に含まれているイベントのみ抽出
        const filtered = allEvents.filter(evt => evt.title.toLowerCase().includes(keyword));
        filtered.forEach(evt => calendar.addEvent(evt));
        filterStatus.innerText = `「${keyword}」で絞り込み中 (${filtered.length}件)`;
        filterStatus.className = "text-xs px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 font-semibold";
      }
    }

    // トースト通知の表示関数
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let bgColor = 'bg-slate-800';
      if (type === 'success') bgColor = 'bg-emerald-600';
      else if (type === 'error') bgColor = 'bg-rose-600';
      else if (type === 'warning') bgColor = 'bg-amber-600';

      toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center justify-between pointer-events-auto text-sm font-medium transition-all duration-300 opacity-0 transform translate-y-2`;
      toast.innerHTML = `
        <span>${message}</span>
        <button onclick="this.parentElement.remove()" class="ml-3 text-white/80 hover:text-white">&times;</button>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function formatDateForInput(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    // 表示用日時フォーマット関数
    function formatDisplayDate(dateStr) {
      const date = new Date(dateStr);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}/${month}/${day} ${hours}:${minutes}`;
    }

    // カスタムトースト通知表示 (alertの代替)
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let bgColor = 'bg-slate-800';
      let icon = 'fa-circle-info';
      
      if (type === 'success') {
        bgColor = 'bg-emerald-600';
        icon = 'fa-circle-check';
      } else if (type === 'error') {
        bgColor = 'bg-rose-600';
        icon = 'fa-triangle-exclamation';
      } else if (type === 'warning') {
        bgColor = 'bg-amber-600';
        icon = 'fa-triangle-exclamation';
      }

      toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 toast-enter pointer-events-auto text-sm font-medium`;
      toast.innerHTML = `
        <i class="fa-solid ${icon} text-base"></i>
        <span class="flex-1">${message}</span>
        <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;

      container.appendChild(toast);

      // アニメーション適用
      setTimeout(() => {
        toast.classList.add('toast-show');
        toast.classList.remove('toast-enter');
      }, 10);

      // 自動消去 (4秒後)
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        toast.style.transition = 'all 0.3s ease-out';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // QRコードスキャナーのオン・オフ切り替え
    async function toggleScanner() {
      if (!isScanning) {
        document.getElementById('reader').classList.remove('hidden');
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

        try {
          isScanning = true;
          document.getElementById('scanQrBtn').innerText = "カメラを閉じる";
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
              document.getElementById('candidateName').value = decodedText;
              filterCalendarEvents(); // QR読み取り完了時に絞り込み実行
              showToast(`IDを読み取りました: ${decodedText}`, 'success');
              stopScanner();
            },
            () => {}
          );
        } catch (err) {
          showToast("カメラ起動エラー: " + err, 'error');
          await stopScanner();
        }
      } else {
        await stopScanner();
      }
    }

    async function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }
      document.getElementById('reader').classList.add('hidden');
      document.getElementById('scanQrBtn').innerText = "カメラ(QR)";
      isScanning = false;
    }

    async function addEvent() {
      const name = document.getElementById('candidateName').value.trim();
      const dateVal = document.getElementById('interviewDate').value;

      if (!name || !dateVal) {
        showToast('名前/IDと日時を両方入力してください。', 'warning');
        return;
      }

      const start = new Date(dateVal.replace('T', ' '));
      const end = new Date(start.getTime() + 60 * 60000);

      const newEvent = {
        title: name,
        start: start,
        end: end,
        allDay: false
      };

      // 全イベントリストに保持
      allEvents.push(newEvent);

      // カレンダー表示を現在の絞り込み条件で再描画
      filterCalendarEvents();

      // GASのAPIへ送信
      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            studentId: name,
            dateVal: dateVal
          })
        });

        showToast('カレンダーとスプレッドシートに登録しました！', 'success');
      } catch (error) {
        showToast('送信エラーが発生しました: ' + error.message, 'error');
      }
    }
  </script>
</body>
</html>
